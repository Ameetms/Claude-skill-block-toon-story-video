<!doctype html><meta charset=utf-8>
<style>
@font-face{font-family:Poppins;font-weight:800;src:url(/node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2)}
@font-face{font-family:Poppins;font-weight:700;src:url(/node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2)}
html,body{margin:0;background:#000;overflow:hidden}#wrap{position:relative;width:100vw;height:100vh}canvas{display:block}
#lab{position:absolute;inset:0;pointer-events:none;font-family:Poppins,sans-serif;color:#2a1a10}
.l{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;font-weight:800;font-size:1.3vw;letter-spacing:.02em}
.l small{display:block;font-weight:700;font-size:.85vw;opacity:.65}
.pin{position:absolute;transform:translate(-50%,-50%);background:#2a1a10;color:#f6e7c8;font:800 .85vw Poppins;padding:.25vw .6vw;border-radius:.5vw;white-space:nowrap}
#title{position:absolute;left:1.9vw;top:1.4vw;font:800 2.5vw Poppins;color:#2a1a10}#title small{display:block;font:700 1vw Poppins;opacity:.65;margin-top:.15vw}
#pal{position:absolute;right:1.9vw;top:1.5vw;display:flex;gap:.55vw}#pal div{text-align:center;font:700 .62vw Poppins}#pal span{display:block;width:3vw;height:2.3vw;border-radius:.5vw;border:.14vw solid #2a1a10;margin-bottom:.2vw}
</style>
<div id=wrap><div id=lab></div></div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as K from '/blockkit.js'; import { buildStation, crowd, chair, bench, lamp, clockStand, coffeeCart, door } from '/station.js'; import { makeOne, pose } from '/cast.js';
const { THREE } = K;
const q = new URLSearchParams(location.search), W = +q.get('w') || 1600, H = +q.get('h') || 900;
await document.fonts.load('800 40px Poppins'); await document.fonts.load('700 20px Poppins');
const S = K.makeStage(W, H, { sky: '#c7dcec' }); document.getElementById('wrap').prepend(S.renderer.domElement);
const { scene, camera, renderer, sun, hemi } = S; hemi.intensity = 2.9; sun.intensity = 1.5; sun.position.set(-7, 11, 4); sun.target.position.set(0, 0, -6);
const lab = document.getElementById('lab');
const PAL = [['WALL', '#dcbf96'], ['FLOOR', '#c7aa7d'], ['STONE', '#d9c39b'], ['WAINSCOT', '#b99a6f'], ['WOOD', '#4a2a16'], ['GOLD', '#e0990d'], ['NAVY', '#16203a'], ['RED', '#a3160f'], ['TEAL', '#1f8f8c'], ['SKY', '#c7dcec']];

/* ---- hall + people (for scale) ---- */
const hall = buildStation(scene);
const people = crowd(scene, 16, { x: [-4.4, 4.4], z: [-26, -4], seed: 9, avoid: (x, z) => x < -2.6 && z > -3 });
const mira = makeOne('mira'), dana = makeOne('dana'), gus = makeOne('gus'), pim = makeOne('pim'); [mira, dana, gus, pim].forEach(c => scene.add(c.root));
for (const c of people) { K.applyPose(c, c.p); c.drawFace(); }

/* ---- prop stage (far away along +x so it never shows in hall shots) ---- */
const PX = 400, props = new THREE.Group(); scene.add(props);
const pf = new THREE.Mesh(new THREE.PlaneGeometry(400, 60), new THREE.MeshLambertMaterial({ color: '#d9c39b' })); pf.rotation.x = -Math.PI / 2; pf.position.set(PX + 100, 0, 0); props.add(pf);
const pw = new THREE.Mesh(new THREE.PlaneGeometry(400, 30), new THREE.MeshLambertMaterial({ color: '#dcbf96' })); pw.position.set(PX + 100, 12, -4); props.add(pw);
props.children.forEach(m => m.receiveShadow = true);
const P = [
  ['SHOE-SHINE CHAIR', 'gold frame · red leather', g => chair(g, [0, 0, 0], [0, .5, 0]), [1.9, 1.15, 2.7], [0, .6, 0], 32],
  ['HALL BENCH', 'dark wood · slatted back', g => bench(g, [0, 0, 0], .35), [2.2, 1.1, 3.4], [0, .5, 0], 32],
  ['COFFEE CART', 'teal + white · canopy', g => coffeeCart(g, [0, 0, 0], -.5), [3.2, 2.0, 5.2], [0, 1.35, 0], 36],
  ['CLOCK STAND', 'gold post · cream face', g => clockStand(g, [0, 0, 0]), [2.6, 2.1, 6.4], [0, 1.7, 0], 40],
  ['PENDANT LAMP', 'hangs from the beams', g => lamp(g, [0, 3.6, 0]), [1.8, 3.6, 4.2], [0, 4.0, 0], 34],
  ['DOOR + SIGN', 'navy · gold trim · TO TRAINS', g => door(g, [0, 0, 0], [0, .3, 0]), [1.2, 2.3, 7.5], [0, 2.1, 0], 36],
];
P.forEach((p, i) => { const g = new THREE.Group(); g.position.set(PX + i * 20, 0, 0); props.add(g); p[2](g); });

const proj = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x * .5 + .5) * W, (-v.y * .5 + .5) * H]; };
const el = (cls, x, y, html) => { const d = document.createElement('div'); d.className = cls; d.style.left = x + 'px'; d.style.top = y + 'px'; d.innerHTML = html; lab.appendChild(d); return d; };
const header = (a, b) => { const d = document.createElement('div'); d.id = 'title'; d.innerHTML = `${a}<small>${b}</small>`; lab.appendChild(d); const p = document.createElement('div'); p.id = 'pal'; p.innerHTML = PAL.map(([n, c]) => `<div><span style="background:${c}"></span>${n}</div>`).join(''); lab.appendChild(p); };
const tile = (x, y, w, h, fn) => { renderer.setViewport(x, H - y - h, w, h); renderer.setScissor(x, H - y - h, w, h); renderer.clear(); camera.aspect = w / h; fn(); camera.updateProjectionMatrix(); renderer.render(scene, camera); };
const CAM = (pos, look, fov, up) => { camera.position.set(...pos); camera.up.set(...(up || [0, 1, 0])); camera.lookAt(...look); camera.fov = fov; };

function cast(t) {
  // staging for scale: Dana + Pim at the shoe-shine corner, Mira walking the hall, Gus at the coffee cart
  [mira, dana, gus, pim].forEach(c => { pose('none', c); c.p.x = 0; c.p.z = -40; });
  pose('dana', dana); Object.assign(dana.p, { x: -3.0, z: .5, yaw: .9 }); dana.p.armL = [0, .1, .1, .25]; dana.p.armR = [0, .1, .1, .25]; dana.face.brow = [-.1, .6, .2];
  pose('pim', pim); Object.assign(pim.p, { x: -2.1, z: -1.9, yaw: -.5 });
  pose('gus', gus); Object.assign(gus.p, { x: 3.7, z: -3.4, yaw: -1.2 });
  pose('mira', mira); K.walk(mira, t * 1.0, 1); mira.face.smile = .6; Object.assign(mira.p, { x: .9, z: -7 - ((t * 1.4) % 3), yaw: Math.PI });
  [mira, dana, gus, pim].forEach(c => { K.idle(c, t, 3); K.applyPose(c, c.p); c.drawFace(); });
}

window.frame = t => {
  const mode = Math.round(t); lab.innerHTML = ''; K.setOutlineWidth(.0016);
  cast(0.3); scene.background = new THREE.Color('#ead9b8');
  renderer.autoClear = false; renderer.setScissorTest(true); renderer.setClearColor('#ead9b8'); renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); renderer.clear();
  hall.ceiling.visible = true; props.visible = true;
  if (mode === 0) {
    header('ENVIRONMENT · TRAIN STATION HALL', 'warm stone hall · arched end window · shoe-shine stand on the left wall · benches down the middle');
    const tw = 760, th = 318, xs = [30, 810], ys = [135, 515];
    const V = [
      ['A · HERO WIDE', 'from the entrance down the hall', () => CAM([0, 1.8, 6.6], [0, 3.6, -29], 46)],
      ['B · END WALL', 'arch window · departures board · two doors', () => CAM([0, 2.3, -11], [0, 4.2, -29.8], 44)],
      ['C · SHOE-SHINE CORNER', 'chair on a wooden platform, sign on the wall', () => CAM([-.6, 1.5, 3.4], [-4.4, 1.2, -1.2], 50)],
      ['D · HIGH-ANGLE CRANE', 'over the crowd (ceiling hidden)', () => { hall.ceiling.visible = false; CAM([4.6, 8.2, 6.2], [-.4, 0, -12], 50); }],
    ];
    V.forEach((v, i) => { const x = xs[i % 2], y = ys[(i / 2) | 0]; tile(x, y, tw, th, v[2]); el('l', x + tw / 2, y + th + 4, `${v[0]}<small>${v[1]}</small>`); });
  } else if (mode === 1) {
    header('ENVIRONMENT · PROPS', 'every prop is rounded boxes in the same palette, outlined like the characters');
    const tw = 486, th = 300, xs = [40, 556, 1072], ys = [140, 520];
    P.forEach((p, i) => { const x = xs[i % 3], y = ys[(i / 3) | 0], cx = PX + i * 20; hall && (hall.ceiling.visible = false);
      tile(x, y, tw, th, () => CAM([cx + p[3][0], p[3][1], p[3][2]], [cx + p[4][0], p[4][1], p[4][2]], p[5]));
      el('l', x + tw / 2, y + th + 4, `${p[0]}<small>${p[1]}</small>`); });
  } else {
    header('ENVIRONMENT · FLOOR PLAN', 'top-down blocking map: where people walk, stand and sit');
    hall.ceiling.visible = false;
    tile(30, 150, 1540, 640, () => { CAM([-1, 120, -13], [-1, 0, -13], 9.3, [-1, 0, 0]); });
    const pins = [['SHOE-SHINE STAND', -4.3, -1.1], ['BENCHES', 0.1, -10.5], ['CLOCK', 0, -17], ['COFFEE CART', 4.7, -4], ['ARCH WINDOW + DOORS', 0, -29], ['ENTRANCE', 0, 5.8]];
    pins.forEach(([n, x, z]) => { const [px, py] = proj(x, 0, z); el('pin', px, py, n); });
  }
  camera.aspect = W / H; renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); renderer.autoClear = true;
};
window.__ready = true;
</script>
